<html lang="en-NZ">

<style>
/* Layout: black-and-gold brand band on top, stacked form cards, a fixed action bar at the thumb. */
:root {
  --bg: #F2F1ED; --surface: #FFFFFF; --surface-2: #F7F6F2; --ink: #171715; --muted: #64625B; --line: #D9D7CF;
  --gold: #C9A227; --gold-ink: #7A5F0A; --gold-soft: #F5ECCD; --band: #111110; --band-ink: #E8E5DA;
  --sel-bg: #171715; --sel-ink: #E6C14C; --danger: #A52A21; --ok: #2D6A3A; --shadow: 0 1px 2px rgba(20,18,10,.06), 0 6px 18px rgba(20,18,10,.05);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0D0C; --surface: #181816; --surface-2: #1F1F1C; --ink: #EEECE5; --muted: #A4A197; --line: #33322D;
  --gold: #D8B23E; --gold-ink: #E2C05C; --gold-soft: #2C2611; --band: #000000; --band-ink: #E8E5DA;
  --sel-bg: #D8B23E; --sel-ink: #111110; --danger: #F07A70; --ok: #86C893; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D0D0C; --surface: #181816; --surface-2: #1F1F1C; --ink: #EEECE5; --muted: #A4A197; --line: #33322D;
  --gold: #D8B23E; --gold-ink: #E2C05C; --gold-soft: #2C2611; --band: #000000; --band-ink: #E8E5DA;
  --sel-bg: #D8B23E; --sel-ink: #111110; --danger: #F07A70; --ok: #86C893; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* brand band */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-bottom: 3px solid var(--gold); }
.band .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 8px; }
.mark { font: 700 21px/1 var(--f-display); letter-spacing: .09em; color: var(--gold); text-transform: uppercase; margin: 0; }
.mark small { display: block; font: 500 11px/1.3 var(--f-body); letter-spacing: .02em; color: var(--band-ink); opacity: .75; text-transform: none; margin-top: 3px; }
.band .grow { flex: 1; min-width: 0; }
.band h1 { font: 700 19px/1.1 var(--f-display); letter-spacing: .04em; margin: 0; color: #fff; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band .ref { font: 600 12px/1.2 var(--f-mono); color: var(--gold); margin-top: 3px; }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a382f; background: transparent; color: var(--band-ink); display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; }

main { padding-block: 18px 120px; }
h2.kicker { font: 700 15px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
h2.kicker::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* new-cert tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 14px 13px; box-shadow: var(--shadow); display: grid; gap: 4px; min-height: 104px; position: relative; overflow: hidden; }
.tile .code { font: 600 11px/1 var(--f-mono); color: var(--gold-ink); letter-spacing: .06em; }
.tile b { font: 700 22px/1.05 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.tile span { color: var(--muted); font-size: 13px; line-height: 1.35; }
.tile::after { content: "+"; position: absolute; right: 12px; top: 8px; font: 700 26px/1 var(--f-display); color: var(--gold); }
.tile:active { transform: scale(.99); }

/* history */
.search { width: 100%; height: 46px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; margin-bottom: 10px; }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 6px 11px 14px; }
.item .main { min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: grid; gap: 3px; }
.item .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .ref { font: 600 12px/1 var(--f-mono); color: var(--muted); }
.item .loc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 12.5px; color: var(--muted); }
.pill { font: 600 10.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 99px; }
.pill.draft { border: 1px solid var(--gold); color: var(--gold-ink); }
.pill.issued { background: var(--sel-bg); color: var(--sel-ink); }
.tag { font: 700 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; background: var(--gold-soft); color: var(--gold-ink); padding: 4px 6px; border-radius: 4px; }
.more { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 16px; color: var(--muted); text-align: center; }

/* form */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 14px 16px; margin-bottom: 14px; }
.card > h3 { font: 700 16px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); margin: 0 -14px 12px; padding: 14px 14px 11px; border-bottom: 1px solid var(--line); }
.fields { display: grid; gap: 16px; }
.field { display: grid; gap: 7px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; line-height: 1.3; }
.field .req { color: var(--gold); margin-left: 3px; }
.field.missing > label, .field.missing > .lbl { color: var(--danger); }
.input { width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 11px 12px; font-size: 16px; }
textarea.input { resize: vertical; line-height: 1.45; }
.input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold-soft); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 44px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; font-size: 15px; text-align: left; }
.opt[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); border-color: var(--sel-bg); font-weight: 600; }
.opt.multi::before { content: ""; display: inline-block; width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 3px; margin-right: 8px; vertical-align: -2px; opacity: .6; }
.opt.multi[aria-pressed="true"]::before { opacity: 1; background: currentColor; box-shadow: inset 0 0 0 2px var(--sel-bg); }
.note { font-size: 13.5px; line-height: 1.45; color: var(--ink); background: var(--gold-soft); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 0 8px 8px 0; margin: 0; }
.note.small { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12.5px; font-style: italic; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.chips.lic { margin-top: 2px; }
.chip small { font-weight: 500; color: var(--muted); }
.chip { min-height: 32px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink); }
.tests { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 44px; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
.trow:first-child { border-top: 0; }
.trow label { font-size: 13.5px; line-height: 1.25; }
.trow .input { min-height: 42px; font-family: var(--f-mono); font-size: 16px; padding: 8px 10px; background: var(--surface); }
.trow .unit { font: 600 11px/1 var(--f-body); color: var(--muted); text-align: right; }
.inline-decl { font-size: 15px; line-height: 2.2; }
.inline-decl select { font-weight: 700; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 6px; padding: 4px 6px; font-size: 16px; }
.sig { position: relative; border: 1px dashed var(--muted); border-radius: 8px; background: var(--surface); height: 160px; touch-action: none; overflow: hidden; }
.sig canvas { width: 100%; height: 100%; display: block; }
.sig .ph { position: absolute; left: 14px; bottom: 12px; right: 14px; border-top: 1px solid var(--line); padding-top: 6px; color: var(--muted); font-size: 12.5px; pointer-events: none; }
.sig.has .ph { display: none; }
.sig-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 46px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sm { min-height: 36px; font-size: 13.5px; padding: 0 12px; }
.btn.primary { background: var(--sel-bg); color: var(--sel-ink); border-color: var(--sel-bg); }
.btn.gold { background: var(--gold); color: #111110; border-color: var(--gold); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn[disabled] { opacity: .45; }
.grid-rows { display: grid; gap: 10px; }
.grow-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px 10px; }
.grow-head { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: 6px; }
.grow-head b { font: 700 15px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.grow-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.gcell { display: grid; gap: 4px; min-width: 0; }
.gcell.wide { grid-column: 1 / -1; }
.gcell span { font-size: 12px; font-weight: 600; color: var(--muted); }
.gcell span i { font-style: normal; color: var(--gold-ink); }
.gcell .input { min-height: 44px; padding: 8px 10px; background: var(--surface); }
.btn.ghost { border-color: transparent; color: var(--danger); background: none; }
.attached { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.attached .ref { font: 600 13px/1 var(--f-mono); }
.attached .meta { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.jobrow { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.jobrow .field { flex: 1 1 140px; }
.jobrow .btn { flex: 0 0 auto; min-height: 48px; }
.input.mono { font-family: var(--f-mono); letter-spacing: .04em; }
.job-card .hint { margin-top: 10px; }
.hint.err { color: var(--danger); }
.banner { display: flex; gap: 10px; align-items: center; border: 1px solid var(--gold); background: var(--gold-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }

/* action bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 10px; }
.bar .wrap { display: flex; gap: 10px; align-items: center; }
.bar .status { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
.bar .btn { flex: none; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 88vh; overflow: auto; border-top: 3px solid var(--gold); }
.sheet h4 { font: 700 22px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 6px; }
.sheet p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.sheet .stack { display: grid; gap: 8px; }
.sheet .fname { font: 600 12.5px/1.4 var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-all; margin-bottom: 12px; }
.sheet ul { margin: 0 0 14px; padding-left: 18px; color: var(--ink); font-size: 14px; }
.copyrow { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 6px 12px; }
.copyrow span { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; user-select: all; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--sel-bg); color: var(--sel-ink); padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; z-index: 60; text-align: center; max-width: calc(100% - 32px); }

/* settings */
.person { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; background: var(--surface-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.setup-hero { padding: 6px 0 2px; }
.setup-hero p { color: var(--muted); max-width: 60ch; }

@media (min-width: 640px) {
  .fields { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .field { grid-column: span 6; }
  .field.w5 { grid-column: span 3; } .field.w3 { grid-column: span 2; } .field.w6 { grid-column: span 4; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="forms.js"></script>
<script src="pdf.js"></script>
<script>
(() => {
"use strict";
const T = window.EPForms, PDF = window.EPPdf;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  dots: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
  share: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
};

// ---------- storage (this phone only) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("Phone storage is full. Export a backup in Settings, then delete old certificates."); return false; } },
};
let linkedSetup = false;
const CFG = window.EPConfig || { company: {}, people: [], records: "" };
let S = store.get("ep.settings", null) || { people: [], meId: null, company: {}, records: "", fergus: { url: "", key: "" } };
// Fill blanks from config.js so preset details reach every phone without overwriting anything typed there.
(function applyPresets() {
  S.fergus = S.fergus || { url: "", key: "" };
  S.company = S.company || {};
  for (const k of Object.keys(CFG.company || {})) if (!S.company[k]) S.company[k] = CFG.company[k];
  if (!S.records && CFG.records) S.records = CFG.records;
  for (const p of CFG.people || []) {
    let mine = S.people.find((x) => x.id === p.id);
    if (!mine) { if ((S.removed || []).includes(p.id)) continue; mine = { id: p.id, sig: null }; S.people.push(mine); }
    for (const k of ["name", "reg", "regPV", "regInsp", "phone", "email"]) if (!mine[k] && p[k]) mine[k] = p[k];
  }
  // One-time setup link: ?fergus=<lookup url>&key=<access code>
  const q = new URLSearchParams(location.search);
  if (q.get("fergus")) { S.fergus = { url: q.get("fergus"), key: q.get("key") || "" }; history.replaceState(null, "", location.pathname); linkedSetup = true; }
  try { localStorage.setItem("ep.settings", JSON.stringify(S)); } catch {}
})();
let certs = store.get("ep.certs", []);
const saveSettings = () => store.set("ep.settings", S);
const saveCerts = () => store.set("ep.certs", certs);
const me = () => S.people.find((p) => p.id === S.meId) || S.people[0];

function initials(name) {
  const w = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "EP";
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase();
}
function nextRef(code) {
  const d = new Date(), ymd = d.toLocaleDateString("en-CA").replace(/-/g, "").slice(2);
  const seq = store.get("ep.seq", {}); const n = (seq[ymd] || 0) + 1; seq[ymd] = n;
  Object.keys(seq).forEach((k) => { if (k !== ymd) delete seq[k]; }); store.set("ep.seq", seq);
  return `EP-${code}-${initials(me().name)}-${ymd}-${String(n).padStart(2, "0")}`;
}
function personVal(p, part) {
  if (!p) return "";
  if (part === "phoneEmail") return [p.phone, p.email].filter(Boolean).join("  ");
  if (part === "regInsp") return p.regInsp || p.reg || "";
  return p[part] || "";
}

// ---------- router ----------
const app = $("#app");
let view = "home", current = null, saveTimer = null;
function go(v, opts = {}) {
  view = v; current = opts.cert || null;
  render(); window.scrollTo(0, 0);
}
function render() {
  if (!S.meId) return renderSetup();
  if (view === "form" && current) return renderForm();
  if (view === "settings") return renderSettings();
  renderHome();
}

// ---------- home ----------
function renderHome() {
  const q = (renderHome.q || "").toLowerCase();
  const list = certs.slice().sort((a, b) => b.updated - a.updated)

function newCert(tplId, seed = {}, opts = {}) {
  const t = T.byId(tplId);
  const data = { ...seed };
  for (const s of t.sections) for (const f of s.fields) {
    if (f.auto === "today" && !data[f.id]) data[f.id] = today();
    if (f.company && !data[f.id]) data[f.id] = S.company.name;
    if (f.person && f.person.p !== "sig" && (f.person.g === "me" || f.person.g === "esc") && !data[f.id]) data[f.id] = personVal(me(), f.person.p);
    if (f.type === "inline") f.parts.forEach((p) => { if (typeof p !== "string" && !data[p.id]) data[p.id] = p.options[0]; });
  }
  const c = { id: uid(), tpl: tplId, ref: nextRef(t.code), status: "draft", created: Date.now(), updated: Date.now(), data };
  certs.push(c); saveCerts(); if (opts.open !== false) go("form", { cert: c });
  return c;
}

function duplicate(c) {

function roiFromCoc(c) {

function linkTests(c, tc) {

function bindAttachCards(c, t) {
  const on = (a, fn) => { const b = document.querySelector(`[data-at="${a}"]`); if (b) b.onclick = fn; };

    if (t.isSolar && t.isSolar(c.data)) seed.pv = "Yes";

      ((a.data.jobNo && a.data.jobNo === c.data.jobNo) || (loc && (a.data.location || "").toLowerCase().includes(loc))) || b.updated - a.updated);
    sheet(`<h4>Attach a test sheet</h4><p>Ones for this job or address are listed first.</p><div class="stack">${list.map((x) =>

    });
  });
  on("copy", () => {
    const tc = byId(c.data._tests); const r = summariseTests(tc);
    const f = findField(t, "tests"); c.data[f.id] = { ...(c.data[f.id] || {}), ...r }; c.updated = Date.now(); saveCerts(); rerenderKeepScroll();
    toast("Worst-case results copied from the test sheet");

// Worst-case figures for the CoC's test results box: lowest insulation, highest continuity and fault loop.
function summariseTests(tc) {
  const rows = (tc.data.circuits || []).filter((r) => r && Object.values(r).some((v) => String(v || "").trim()));
  const num = (v) => { const m = String(v || "").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  const pick = (k, worst) => { let best = null; for (const r of rows) { const n = num(r[k]); if (n == null) continue; if (!best || (worst === "min" ? n < best.n : n > best.n)) best = { n, v: r[k] }; } return best ? String(best.v).trim() : ""; };
  const pols = rows.map((r) => String(r.pol || "").trim()).filter(Boolean);
  const bad = pols.some((p) => !/^(ok|correct|yes|✓|y|pass)$/i.test(p));
  const trip = pick("trip", "max");
  const out = {
    ir: pick("ir", "min"),
    ec: pick("r1r2", "max"), efli: pick("efli", "max") || (tc.data.zeMsb || ""),
    other: [trip && `RCD max ${trip} ms`, `see test sheet ${tc.ref}`].filter(Boolean).join(", "),
  };
  if (pols.length) out.polarity = bad ? "See test sheet" : "Correct";
    for (const k of Object.keys(out)) if (!out[k]) delete out[k];
  return out;
}

// ---------- Fergus job lookup ----------
function jobCardHtml(c, t) {
  const ready = !!(S.fergus.url && S.fergus.key);
  return `<section class="card job-card"><h3>Fergus job</h3>
    <div class="jobrow">
      <div class="field"><label for="f-jobNo">Job number</label>

      ${ready ? `<button type="button" class="btn gold" id="fergusFill">Fill from Fergus</button>` : ""}
    </div>
    <p class="hint" id="jobHint">${ready ? `Pulls the site address, customer and job description into empty fields. Needs signal; everything else works offline.` :
      `Set up the Fergus lookup in Settings to fill this certificate from a job number.`}</p>
  </section>`;
}
function bindJobCard(c, t) {
  const inp = $("#f-jobNo"), btn = $("#fergusFill"), hint = $("#jobHint");
  inp.oninput = () => { c.data.jobNo = inp.value.trim(); c.updated = Date.now(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 350); };
  inp.onkeydown = (e) => { if (e.key === "Enter" && btn) { e.preventDefault(); btn.click(); } };
  if (!btn) return;
  btn.onclick = async () => {
    const n = (inp.value.match(/\d+/) || [""])[0];
    if (!n) { inp.focus(); return toast("Type the Fergus job number first"); }
    if (!navigator.onLine) return toast("No signal. Fill it in by hand, or try again when you're back online.");
    btn.disabled = true; btn.textContent = "Looking up…";
    try {
      const job = await fergusLookup(n);
      const filled = applyJob(c, t, job); licenceSwitch(c, t);
      c.data.jobNo = job.jobNumber || ("EP-" + n); flush();
      renderForm(); window.scrollTo(0, 0);
      toast(filled.length ? `Filled ${filled.join(", ")} from ${c.data.jobNo}` : `${c.data.jobNo} found. Those fields already had something in them, so nothing was changed.`);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Fill from Fergus";
      hint.textContent = e.message; hint.classList.add("err");
    }
  };
}
async function fergusLookup(n) {
  const url = new URL(S.fergus.url); url.searchParams.set("job", n); url.searchParams.set("key", S.fergus.key);
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 15000);
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(S.fergus.url)) { clearTimeout(timer); throw new Error("The lookup address should start with https://script.google.com/macros/s/ and end in /exec. Copy the Web app URL from Deploy → Manage deployments."); }
  let j;
  try {
    const res = await fetch(url, { signal: ctl.signal, redirect: "follow" });
    j = await res.json();
  } catch (e) {
    if (e.name === "AbortError") { clearTimeout(timer); throw new Error("Fergus took too long to answer. Check your signal and try again."); }
    // Some phones block the direct request; try again by loading it as a script.
    try { j = await jsonp(url); }
    catch { clearTimeout(timer); throw new Error("Couldn't reach the Fergus lookup. Check the deployment is set to 'Who has access: Anyone', and that the lookup address ends in /exec."); }
  }
  clearTimeout(timer);
  if (!j || typeof j !== "object") throw new Error("The Fergus lookup sent back something unexpected. Check the lookup address in Settings.");
  if (!j.ok) throw new Error(j.error || "Fergus lookup failed.");
  return j.job;
}
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "epFergus" + Date.now(), u = new URL(url); u.searchParams.set("callback", cb);
    const el = document.createElement("script"); let done = false;
    const end = () => { done = true; delete window[cb]; el.remove(); };
    window[cb] = (data) => { end(); resolve(data); };
    el.onerror = () => { if (!done) { end(); reject(new Error("load")); } };
    setTimeout(() => { if (!done) { end(); reject(new Error("timeout")); } }, 15000);
    el.src = u.toString(); document.head.appendChild(el);
  });
}

function jobFields(job) {

  const contactName = [job.contactFirstName, job.contactLastName].filter(Boolean).join(" ");
  const who = job.customer && contactName && job.customer !== contactName ? `${job.customer} (${contactName})` : (job.customer || contactName);
  const reach = (job.contactItems || []).map((x) => x.value).filter(Boolean).join("  ");
  const desc = String(job.longDescription || job.description || "").replace(/<[^>]+>/g, " ").replace(/[ \t]+\n/g, "\n").trim();

function bindForm(c, t) {

      const el = $("#f-" + f.id); el.oninput = () => { d[f.id] = el.value; el.closest(".field").classList.remove("missing"); changed(); };
      if (f.type === "textarea") { const grow = () => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }; el.addEventListener("input", grow); requestAnimationFrame(grow); }
    }

    if (f.type === "grid") {

        if (f.counter) { const n = parseInt(prev[f.counter], 10); nr[f.counter] = String(isNaN(n) ? rows.length + 1 : n + 1); }
        rows.push(nr); changed(); flush(); rerenderKeepScroll();
        const last = document.querySelectorAll(`[data-grid="${f.id}"][data-k="${f.cols[1].id}"]`); last[last.length - 1]?.focus({ preventScroll: false });

    b.parentElement.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-pressed", Array.isArray(d[f.id]) ? d[f.id].includes(o.dataset.val) : d[f.id] === o.dataset.val));
    b.closest(".field").classList.remove("missing"); changed();
  }));
  form.querySelectorAll("[data-fill]").forEach((b) => (b.onclick = () => {
    const p = S.people.find((x) => x.id === b.dataset.pid);
    for (const s of t.sections) for (const f of s.fields) if (f.person && f.person.g === b.dataset.fill && f.person.p !== "sig") {
      d[f.id] = personVal(p, f.person.p); const el = $("#f-" + f.id); if (el) el.value = d[f.id];
    }

    const id = b.dataset.lic; d[id] = b.dataset.v; $("#f-" + id).value = d[id];

// Licence fields follow the work: solar certificates use each person's solar (PV) licence,
// everything else their general licence. Only numbers that belong to a saved person are swapped,
// so a number typed by hand is never overwritten.
function licenceSwitch(c, t) {
  if (!t.isSolar) return;
  const solar = !!t.isSolar(c.data), swapped = [];
  for (const s of t.sections) for (const f of s.fields) {
    if (!f.person || f.person.p !== "reg") continue;
    const v = (c.data[f.id] || "").trim(); if (!v) continue;
    const p = S.people.find((x) => x.reg === v || (x.regPV && x.regPV === v)); if (!p || !p.regPV) continue;
    const want = solar ? p.regPV : p.reg;
    if (want && want !== v) { c.data[f.id] = want; const el = $("#f-" + f.id); if (el) el.value = want; swapped.push(want); }
  }
  if (swapped.length) toast(solar ? `Solar work: using licence ${swapped[0]}` : `Using general licence ${swapped[0]}`);
}
function licenceChips(f) {
  if (!f.person || !["reg", "regInsp"].includes(f.person.p)) return "";
  const out = [];
  for (const p of S.people) for (const [k, tag] of [["reg", ""], ["regPV", "solar"], ["regInsp", "inspector"]]) if (p[k]) out.push({ v: p[k], who: p.name.split(" ")[0], tag });
  if (out.length < 2) return "";
  return `<div class="chips lic">${out.map((o) => `<button type="button" class="chip" data-lic="${f.id}" data-v="${esc(o.v)}">${esc(o.v)}<small> ${esc(o.who)}${o.tag ? " · " + o.tag : ""}</small></button>`).join("")}</div>`;
}
function findField(t, id) { for (const s of t.sections) for (const f of s.fields) if (f.id === id) return f; }
function refreshVisibility(t, d) {
  for (const s of t.sections) for (const f of s.fields) if (f.showIf) { const el = document.querySelector(`[data-f="${f.id}"]`); if (el) el.hidden = !shown(f, d); }
}
function flush() {
  clearTimeout(saveTimer); if (!current) return;
  if (saveCerts()) { const st = $("#status"); if (st) st.textContent = "Saved on this phone"; }
}

// ---------- signatures ----------
function sigPad(f, c, changed) {
  const box = $("#f-" + f.id), cv = box.querySelector("canvas"), ctx = cv.getContext("2d");
  let strokes = [], drawing = false;
  function size() {
    const r = box.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint();
  }
  function paint() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const v = c.data[f.id];
    if (!strokes.length && v && v.img) { const im = new Image(); im.onload = () => { const r = box.getBoundingClientRect(); const s = Math.min((r.width - 20) / im.width, (r.height - 20) / im.height, 1.4); ctx.drawImage(im, (r.width - im.width * s) / 2, (r.height - im.height * s) / 2, im.width * s, im.height * s); }; im.src = v.img; }
    ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#111";
    for (const st of strokes) { ctx.lineWidth = 2.4; ctx.beginPath(); st.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (st.length === 1) ctx.lineTo(st[0].x + 0.1, st[0].y); ctx.stroke(); }
  }
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.onpointerdown = (e) => { if (!strokes.length && c.data[f.id]) { c.data[f.id] = null; } drawing = true; cv.setPointerCapture(e.pointerId); strokes.push([pt(e)]); box.classList.add("has"); paint(); };
  cv.onpointermove = (e) => { if (!drawing) return; (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach((ev) => strokes[strokes.length - 1].push(pt(ev))); paint(); };
  cv.onpointerup = cv.onpointercancel = () => { if (!drawing) return; drawing = false; c.data[f.id] = exportSig(strokes); changed(); };
  const set = (v) => { strokes = []; c.data[f.id] = v; box.classList.toggle("has", !!v); paint(); changed(); };
  $(`[data-sigclear="${f.id}"]`).onclick = () => set(null);
  const cp = $(`[data-sigcopy="${f.id}"]`); if (cp) cp.onclick = () => { const src = c.data[f.copyFrom]; if (!src) return toast("Sign the CoC first"); set(structuredClone(src)); };
  document.querySelectorAll(`[data-sigsaved="${f.id}"]`).forEach((b) => (b.onclick = () => { const p = S.people.find((x) => x.id === b.dataset.pid); set(structuredClone(p.sig)); }));
  new ResizeObserver(size).observe(box);
}
// Crop to the ink and save as a small PNG so history stays light on phone storage.
function exportSig(strokes) {
  const pts = strokes.flat(); if (!pts.length) return null;
  const pad = 6, minX = Math.min(...pts.map((p) => p.x)) - pad, minY = Math.min(...pts.map((p) => p.y)) - pad;
  const w = Math.max(...pts.map((p) => p.x)) + pad - minX, h = Math.max(...pts.map((p) => p.y)) + pad - minY;
  const scale = Math.min(2, 520 / w), cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(w * scale)); cv.height = Math.max(1, Math.round(h * scale));
  const x = cv.getContext("2d"); x.scale(scale, scale); x.translate(-minX, -minY);
  x.lineCap = x.lineJoin = "round"; x.strokeStyle = "#101010"; x.lineWidth = 2.6;
  for (const st of strokes) { x.beginPath(); st.forEach((p, i) => (i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y))); if (st.length === 1) x.lineTo(st[0].x + 0.1, st[0].y); x.stroke(); }
  return { img: cv.toDataURL("image/png"), w: cv.width, h: cv.height };
}

// ---------- PDF + sharing ----------
function fileName(c) {
  const loc = (c.data.location || "").split(/[\n,]/)[0].replace(/[^\w\s-]/g, "").trim().slice(0, 40);
  return `${c.ref}${c.data.jobNo ? " " + c.data.jobNo.replace(/[^\w-]/g, "") : ""}${loc ? " " + loc : ""}.pdf`;
}
function buildPdf(c) {
  const tc = byId(c.data._tests);
  const att = tc ? [{ t: T.byId(tc.tpl), data: { ...tc.data, forCert: tc.data.forCert || c.ref, _ref: tc.ref } }] : [];
  const doc = PDF.renderCert(window.jspdf.jsPDF, T.byId(c.tpl), { ...c.data, _ref: c.ref }, S, att);
  return new File([doc.output("blob")], fileName(c), { type: "application/pdf" });
}
function previewPdf(c) {
  try { const url = URL.createObjectURL(buildPdf(c)); const w = window.open(url, "_blank"); if (!w) location.href = url; setTimeout(() => URL.revokeObjectURL(url), 60000); }
  catch (e) { toast("Couldn't build the PDF: " + e.message); }
}
function missingFields(c) {
  const t = T.byId(c.tpl), d = c.data, out = [];
  for (const s of t.sections) for (const f of s.fields) {
    if (!f.req || !shown(f, d)) continue;
    const v = d[f.id]; const empty = v == null || v === "" || (Array.isArray(v) && !v.length);
    if (empty) out.push({ f, s });
  }
  return out;
}
function finish(c) {
  const miss = missingFields(c);
  document.querySelectorAll(".field.missing").forEach((e) => e.classList.remove("missing"));
  if (!miss.length) return issueSheet(c);
  miss.forEach(({ f }) => document.querySelector(`[data-f="${f.id}"]`)?.classList.add("missing"));
  sheet(`<h4>${miss.length} field${miss.length > 1 ? "s" : ""} still empty</h4>
    <ul>${miss.slice(0, 8).map(({ f, s }) => `<li>${esc(f.label || s.title)}</li>`).join("")}${miss.length > 8 ? `<li>and ${miss.length - 8} more</li>` : ""}</ul>
    <div class="stack"><button class="btn primary" data-a="fix">Go to the first one</button><button class="btn" data-a="anyway">Issue anyway</button></div>`, (el, close) => {
    el.querySelector('[data-a="fix"]').onclick = () => { close(); const n = document.querySelector(`[data-f="${miss[0].f.id}"]`); n?.scrollIntoView({ behavior: "smooth", block: "center" }); n?.querySelector("input,textarea,button")?.focus({ preventScroll: true }); };
    el.querySelector('[data-a="anyway"]').onclick = () => { close(); issueSheet(c); };
  });
}
function issueSheet(c, reshare = false) {
  let file;
  try { file = buildPdf(c); } catch (e) { return toast("Couldn't build the PDF: " + e.message); }
  if (c.status !== "issued") { c.status = "issued"; c.issuedAt = Date.now(); saveCerts(); }
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const rec = S.records;
  sheet(`<h4>${reshare ? "Share certificate" : "Certificate ready"}</h4>
    <div class="fname">${esc(file.name)}</div>
    ${rec ? `<p>Send it to the records inbox, and to the customer if they need a copy.</p>
      <div class="copyrow" style="margin-bottom:12px"><span>${esc(rec)}</span><button class="btn sm" data-a="copy">Copy</button></div>` :
      `<p>Add your records Gmail address in Settings so it's shown here every time.</p>`}
    <div class="stack">
      ${canShare ? `<button class="btn gold" data-a="share">${ICON.share} Share PDF</button><p class="hint" style="margin:0 0 4px">Pick Gmail or Mail in the share menu and send it to the address above.</p>` : ""}
      <button class="btn${canShare ? "" : " gold"}" data-a="save">Save PDF to phone</button>
      <button class="btn" data-a="view">View PDF</button>
      <button class="btn" data-a="done">Done</button>
    </div>`, (el, close) => {
    const cp = el.querySelector('[data-a="copy"]');
    if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(rec); toast("Address copied"); } catch { const r = document.createRange(); r.selectNodeContents(el.querySelector(".copyrow span")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Address selected. Tap Copy."); } };
    const sh = el.querySelector('[data-a="share"]');
    if (sh) sh.onclick = async () => {
      try { await navigator.share({ files: [file], title: file.name.replace(/\.pdf$/, ""), text: `${T.byId(c.tpl).title} ${c.ref}` }); toast("Shared"); }
      catch (e) { if (e.name !== "AbortError") toast("Sharing didn't work here. Use Save PDF instead."); }
    };
    el.querySelector('[data-a="save"]').onclick = () => { const url = URL.createObjectURL(file); const a = document.createElement("a"); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); toast("PDF saved"); };
    el.querySelector('[data-a="view"]').onclick = () => previewPdf(c);
    el.querySelector('[data-a="done"]').onclick = () => { close(); go("home"); };
  });
}

  $("#addPerson").onclick = () => { S.people.push({ id: "p-" + uid(), name: "", reg: "", phone: "", email: "", sig: null }); saveSettings(); renderSettings(setup); $(`#pn-${S.people.length - 1}`)?.focus(); };
  $("#rec").oninput = (e) => { S.records = e.target.value.trim(); saveSettings(); };
  app.querySelectorAll("[data-ck]").forEach((inp) => (inp.oninput = () => { S.company[inp.dataset.ck] = inp.value; saveSettings(); }));
  const fgu = $("#fgu"), fgk = $("#fgk"), out = $("#fgOut");
  fgu.oninput = () => { S.fergus.url = fgu.value.trim(); saveSettings(); };
  fgk.oninput = () => { S.fergus.key = fgk.value.trim(); saveSettings(); };
  $("#fgTest").onclick = async () => {
    if (!S.fergus.url || !S.fergus.key) { out.textContent = "Fill in the lookup address and access code first."; return; }
    const n = S.lastTestJob || "";
    out.innerHTML = `<span style="display:flex;gap:8px;align-items:center"><input class="input mono" id="fgN" style="max-width:120px;min-height:40px" inputmode="numeric" placeholder="Job no." value="${esc(n)}"><button class="btn sm gold" id="fgGo">Look up</button></span>`;
    const go2 = async () => {
      const v = ($("#fgN").value.match(/\d+/) || [""])[0]; if (!v) return;
      S.lastTestJob = v; saveSettings(); $("#fgGo").disabled = true;
      try { const job = await fergusLookup(v); const j = jobFields(job); out.textContent = `Working. ${job.jobNumber}: ${j.customer || "no customer"}, ${j.site || "no site address"}.`; }
      catch (e) { out.textContent = e.message; }
    };
    $("#fgGo").onclick = go2; $("#fgN").onkeydown = (e) => { if (e.key === "Enter") go2(); }; $("#fgN").focus();
  };
  $("#fgLink").onclick = async () => {
    if (!S.fergus.url || !S.fergus.key) { out.textContent = "Fill in the lookup address and access code first."; return; }
    const link = `${location.origin}${location.pathname}?fergus=${encodeURIComponent(S.fergus.url)}&key=${encodeURIComponent(S.fergus.key)}`;
    try { await navigator.clipboard.writeText(link); out.textContent = "Setup link copied. Send it to the other phone and open it there once. It contains the access code, so only send it to your team."; }
    catch { out.innerHTML = `<span class="copyrow"><span>${esc(link)}</span></span>`; }
  };
  const st = $("#startUsing"); if (st) st.onclick = () => { if (!S.meId) return toast("Tap your name at the top first"); go("home"); };
  const ex = $("#exp"); if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify({ app: "ep-certs", v: 1, exported: new Date().toISOString(), settings: S, certs }, null, 1)], { type: "application/json" });
    const file = new File([blob], `ep-certs-backup-${today()}.json`, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); }
  };
  const im = $("#imp"); if (im) im.onchange = async () => {
    try {
      const j = JSON.parse(await im.files[0].text()); if (j.app !== "ep-certs") throw new Error("not an EP Certs backup");
      const have = new Set(certs.map((c) => c.id)); const add = j.certs.filter((c) => !have.has(c.id));
      certs = certs.concat(add); saveCerts(); toast(`Restored ${add.length} certificate${add.length === 1 ? "" : "s"}`); renderSettings();
    } catch (e) { toast("That file couldn't be restored: " + e.message); }
  };
}
function renderSetup() { renderSettings(true); }
function savedSigPad(box, p) {
  const cv = box.querySelector("canvas"), ctx = cv.getContext("2d"); let strokes = [], drawing = false;
  const paint = () => {
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = 2.4;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
    if (!strokes.length && p.sig) { const im = new Image(); im.onload = () => { const r = box.getBoundingClientRect(); const s = Math.min((r.width - 20) / im.width, (r.height - 20) / im.height, 1.4); ctx.drawImage(im, (r.width - im.width * s) / 2, (r.height - im.height * s) / 2, im.width * s, im.height * s); }; im.src = p.sig.img; }
    for (const st of strokes) { ctx.beginPath(); st.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.stroke(); }
  };
  const size = () => { const r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2); cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); paint(); };
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.onpointerdown = (e) => { drawing = true; cv.setPointerCapture(e.pointerId); if (!strokes.length) p.sig = null; strokes.push([pt(e)]); box.classList.add("has"); paint(); };
  cv.onpointermove = (e) => { if (drawing) { strokes[strokes.length - 1].push(pt(e)); paint(); } };
  cv.onpointerup = cv.onpointercancel = () => { if (!drawing) return; drawing = false; p.sig = exportSig(strokes); saveSettings(); };
  new ResizeObserver(size).observe(box);
}

// ---------- small UI helpers ----------
function sheet(html, bind) {
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => s.remove();
  s.onclick = (e) => { if (e.target === s) close(); };
  document.body.appendChild(s); bind(s, close);
  s.querySelector("button")?.focus({ preventScroll: true });
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

render();
if (linkedSetup) toast("Fergus lookup set up on this phone");
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
window.__ep = { newCert, get certs() { return certs; }, S };
})();
